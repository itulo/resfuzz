# Campaign config for `resfuzz run -c host/examples/qemu.toml`.
# Run on QNX SDP 8.0 + mkqnximage QEMU x86_64 (TCG) - see docs/TODO-QNX.md.
# Paths are relative to the repo root; replace the key paths with yours.
out_dir = "resfuzz-results"

[image]
workdir = "qnx-image"            # mkqnximage works on the image in its current directory
arch = "x86_64"                  # --arch=x86_64|aarch64le
ssh_ident = "/home/me/.ssh/id_ed25519.pub"   # --ssh-ident takes the PUBLIC key (TODO-QNX I3)
# The default /data partition (61 MB) fills up after ~3000 corpus files: grow it.
extra_args = ["--noprompt", "--data-size=512", "--data-inodes=65536"]
# assumed_ip = "172.31.1.150"    # --assumed-ip, skips --getip

[target]
agent  = "target/build-qnx/resfuzz-agent"
resmgr = "target/build-qnx/buggy_rm"
path   = "/dev/buggy"
spawn  = "/data/resfuzz/buggy_rm /dev/buggy"
deploy_dir = "/data/resfuzz"     # /data is always read-write on mkqnximage images
dump_dir   = "/data/var/dumper"  # the image's own dumper writes <prog>.core here (TODO-QNX T1)
dicts = ["target/examples/buggy_rm.qnx.dict"]   # dcmds resolved on QNX by dictgen's resolver
gdb = "ntox86_64-gdb"            # SDP 8.0 host cross gdb

[fuzz]
seconds = 600
# Under QEMU TCG the slow path of BUG3a takes ~650 ms and ordinary replies up to
# ~60 ms, so 100 ms separates them; on KVM or hardware use a few ms.
deadline_us = 100000
hang_ms = 2000
coverage = true

[ssh]
user = "root"
identity = "/home/me/.ssh/id_ed25519"   # private key for ssh -i / scp -i
