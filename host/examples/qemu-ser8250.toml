# Stock QNX 8.0 campaign: ser8250 (no planted bugs).
# Private spawn of SDP devc-ser8250 on unit 3 (/dev/ser3).
#   scripts/qnx-up.sh
#   python3 scripts/run-existing.py -c host/examples/qemu-ser8250.toml --host <ip> --seconds 1800
out_dir = "resfuzz-results/qnx-ser82501"

[image]
workdir = "qnx-image"
arch = "x86_64"
ssh_ident = "/home/me/.ssh/id_ed25519.pub"
extra_args = ["--noprompt", "--data-size=512", "--data-inodes=65536"]

[target]
agent  = "target/build-qnx/resfuzz-agent"
resmgr = "/home/me/qnx800/target/qnx/x86_64/sbin/devc-ser8250"
path   = "/dev/ser3"
spawn  = "/data/resfuzz/rmwrap --wait /dev/ser3 --name devc-ser8250 -- /data/resfuzz/devc-ser8250 -u3 -e -b115200"
deploy_dir = "/data/resfuzz"
dump_dir   = "/data/var/dumper"
dicts = ["target/examples/dcmd_chr.qnx.dict", "target/examples/dcmd_all.qnx.dict"]
gdb = "ntox86_64-gdb"

[fuzz]
seconds = 1800
deadline_us = 100000
hang_ms = 2000
coverage = false
agent_args = ["--nonblock", "--respawn-every", "0"]
# Private unit 3 via rmwrap; does not touch the image ser1/ser2 console.

[ssh]
user = "root"
identity = "/home/me/.ssh/id_ed25519"
