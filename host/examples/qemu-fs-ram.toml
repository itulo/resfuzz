# Stock: private devb-ram + qnx6 mount, fuzz a regular file on it (no planted bugs).
# Setup happens in scripts/stock-hunt.sh (pre): creates /dev/hd1, partitions, mkqnx6fs, mounts at /mnt/rf.
out_dir = "resfuzz-results/qnx-fs-ram1"

[image]
workdir = "qnx-image"
arch = "x86_64"
ssh_ident = "/home/me/.ssh/id_ed25519.pub"
extra_args = ["--noprompt", "--data-size=512", "--data-inodes=65536"]

[target]
agent  = "target/build-qnx/resfuzz-agent"
resmgr = "/home/me/qnx800/target/qnx/x86_64/sbin/devb-ram"
path   = "/mnt/rf/fuzzfile"
spawn  = ""
deploy_dir = "/data/resfuzz"
dump_dir   = "/data/var/dumper"
dicts = ["target/examples/dcmd_blk.qnx.dict", "target/examples/dcmd_all.qnx.dict"]
gdb = "ntox86_64-gdb"

[fuzz]
seconds = 1800
deadline_us = 100000
hang_ms = 2000
coverage = false
agent_args = ["--nonblock"]
# attach-only to the mounted file; the block driver stays up for the whole run

[ssh]
user = "root"
identity = "/home/me/.ssh/id_ed25519"
