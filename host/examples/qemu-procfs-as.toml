# Stock QNX 8.0 campaign: procfs-as (no planted bugs).
# Attach-only fuzz of procfs (/proc/1/as).
#   scripts/qnx-up.sh
#   python3 scripts/run-existing.py -c host/examples/qemu-procfs-as.toml --host <ip> --seconds 1800
out_dir = "resfuzz-results/qnx-procfs-as1"

[image]
workdir = "qnx-image"
arch = "x86_64"
ssh_ident = "/home/me/.ssh/id_ed25519.pub"
extra_args = ["--noprompt", "--data-size=512", "--data-inodes=65536"]

[target]
agent  = "target/build-qnx/resfuzz-agent"
resmgr = "/home/me/qnx800/target/qnx/x86_64/sbin/devc-pty"
path   = "/proc/1/as"
spawn  = ""
deploy_dir = "/data/resfuzz"
dump_dir   = "/data/var/dumper"
dicts = ["target/examples/dcmd_proc.qnx.dict", "target/examples/dcmd_all.qnx.dict"]
gdb = "ntox86_64-gdb"

[fuzz]
seconds = 1800
deadline_us = 100000
hang_ms = 2000
coverage = false
agent_args = ["--nonblock"]
# attach-only: address-space file of pid 1 (procnto).

[ssh]
user = "root"
identity = "/home/me/.ssh/id_ed25519"
