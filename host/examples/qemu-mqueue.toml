# Campaign against the SDP's own unmodified mqueue (no planted bugs).
# Point resmgr at your SDP copy; do not redistribute the QNX binary.
# The system mqueue is slayed first so the agent can spawn a private instance
# (and recreate /dev/mqueue/rfz after every restart via mqwrap).
#   python3 scripts/run-existing.py -c host/examples/qemu-mqueue.toml --host <ip> \
#     --extra target/examples/mqwrap --pre 'slay -f mqueue || true' \
#     --post '/system/bin/mqueue </dev/null >/dev/null 2>&1 & true'
out_dir = "resfuzz-results/qnx-mqueue1"

[image]
workdir = "qnx-image"
arch = "x86_64"
ssh_ident = "/home/me/.ssh/id_ed25519.pub"
extra_args = ["--noprompt", "--data-size=512", "--data-inodes=65536"]

[target]
agent  = "target/build-qnx/resfuzz-agent"
resmgr = "/home/me/qnx800/target/qnx/x86_64/sbin/mqueue"
path   = "/dev/mqueue/rfz"
spawn  = "/data/resfuzz/mqwrap /data/resfuzz/mqueue /rfz"
deploy_dir = "/data/resfuzz"
dump_dir   = "/data/var/dumper"
dicts = ["target/examples/dcmd_misc.qnx.dict", "target/examples/dcmd_all.qnx.dict"]
gdb = "ntox86_64-gdb"

[fuzz]
seconds = 300
deadline_us = 100000
hang_ms = 2000
coverage = false
agent_args = ["--respawn-every", "0"]  # one instance: leftovers from a mid-run restart are messy

[ssh]
user = "root"
identity = "/home/me/.ssh/id_ed25519"
